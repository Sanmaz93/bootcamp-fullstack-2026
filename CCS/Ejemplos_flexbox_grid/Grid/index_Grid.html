<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./Index_Grid.css">
</head>
<body>
<div class="grid">
  <div>1</div><div>2</div><div>3</div>
  <div>4</div><div>5</div><div>6</div>
</div>
<div class="galeria">
  <img src="1 (2).png" alt="Imagen 1">
  <img src="2 (2).png" alt="Imagen 2">
  <img src="3.jpg" alt="Imagen 3">
  <img src="4 (2).png" alt="Imagen 4">
</div>
<div class="pagina">
  <header>Cabecera</header>
  <aside>Lateral</aside>
  <main>Contenido</main>
  <footer>Pie</footer>
</div>
<div class="tablero">
  <div class="destacado">Destacado</div>
  <div>A</div><div>B</div><div>C</div><div>D</div>
</div>
<div class="lineas">
  <div class="a">A</div>
  <div class="b">B</div>
  <div class="c">C</div>
</div>
<div class="centro"><p>Centrado</p></div>
<figure class="banner">
  <img src="3.jpg" alt="logo">
  <figcaption>Título sobre la imagen</figcaption>
</figure>
<div class="mosaico">
  <div class="ancho">1</div><div>2</div><div class="alto">3</div>
  <div>4</div><div class="grande">5</div><div>6</div>
</div>
<form class="formulario">
  <label for="nombre">Nombre</label>
  <input id="nombre" type="text">
  <label for="correo">Correo electrónico</label>
  <input id="correo" type="email">
  <label for="msg">Mensaje</label>
  <textarea id="msg"></textarea>
  <button type="submit">Enviar</button>
</form>
</body>
</html>
