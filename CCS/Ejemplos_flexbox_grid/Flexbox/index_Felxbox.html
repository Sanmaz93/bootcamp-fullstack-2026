<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./Index_Flexbox.css">
  <title>Document</title>
  </head>
<body>
<header class="barra">
  <a href="#">Inicio</a>
  <a href="#">Perfil</a>
  <button class="salir">Salir</button>
</header>
<nav class="navbar">
  <div class="logo">MiSitio</div>
  <ul class="menu">
    <li><a href="#">Inicio</a></li>
    <li><a href="#">Servicios</a></li>
    <li><a href="#">Contacto</a></li>
  </ul>
</nav>
<div class="centrado">
  <div class="caja">Hola</div>
</div>
<section class="tarjetas">
  <article class="tarjeta">Uno</article>
  <article class="tarjeta">Dos</article>
  <article class="tarjeta">Tres</article>
  <article class="tarjeta">Cuatro</article>
</section>
<br>
<div class="layout">
  <aside class="lateral">Menú</aside>
  <main class="contenido">Contenido principal</main>
</div>
<div class="fila">
  <div class="card">
    <h3>Plan básico</h3>
    <p>Texto corto.</p>
    <button>Elegir</button>
  </div>
  <div class="card">
    <h3>Plan pro</h3>
    <p>Un texto bastante más largo que ocupa varias líneas.</p>
    <button>Elegir</button>
  </div>
</div>
<br>
<div class="media">
  <img src="avatar.jpg" alt="Avatar" class="avatar">
  <div class="texto">
    <h4>Santiago Herrera</h4>
    <p>Comentario del usuario…</p>
  </div>
</div>
<div class="contenedor">
  <aside class="lateral">Lateral</aside>
  <main class="principal">Principal</main>
</div>
<form class="buscador">
  <input type="search" placeholder="Buscar…">
  <button type="submit">Buscar</button>
</form>
</body>
